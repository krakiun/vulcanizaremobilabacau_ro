# Întrebările frecvente de pe pagina principală (și din schema FAQPage).
- q: Sunteți disponibili non-stop în Bacău?
  a: Da. Vulcanizarea mobilă funcționează non-stop, 24 de ore din 24, 7 zile din 7, inclusiv în weekend și de sărbătorile legale.
- q: Veniți acasă, la birou sau pe drum?
  a: 'Da. Intervenim oriunde se poate lucra în siguranță: în fața casei, la bloc, în parcarea biroului, la sediul firmei sau pe marginea drumului.'
- q: Cât de repede ajungeți?
  a: Timpul de sosire depinde de locul în care te afli și de trafic. La telefon îți spunem un timp estimat, ca să știi exact la ce să te aștepți.
- q: Cât costă o vulcanizare mobilă în Bacău?
  a: Prețul depinde de lucrare, de dimensiunea roților și de distanță. Îți comunicăm tariful înainte să plecăm spre tine, fără costuri ascunse.
- q: Se poate repara orice pană pe loc?
  a: Majoritatea penelor din banda de rulare se repară pe loc. Dacă flancul anvelopei este tăiat sau umflat, reparația nu mai este sigură și îți recomandăm înlocuirea anvelopei.
- q: Faceți și echilibrare roți la domiciliu?
  a: Da. Avem echipament mobil de echilibrare computerizată, astfel încât roțile sunt echilibrate direct la locație.
- q: Faceți schimb de anvelope vară/iarnă la domiciliu?
  a: Da. Stabilim împreună ora și venim la adresa ta din Bacău sau din împrejurimi pentru schimbul sezonier.
- q: Lucrați și pentru firme sau flote auto?
  a: Da. Facem intervenții și schimb sezonier pentru flote, direct la sediul firmei, cu programare și factură.
